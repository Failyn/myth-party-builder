<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Myth Party Builder</title>
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* layout: tabbed tool. Builder = dungeon rail | party boxes | roster cards. Energy = one row per character. */
:root{
  --bg:#f2f4f7; --surface:#ffffff; --surface-2:#e9ecf1; --ink:#1b2130; --muted:#5b6472; --line:#d8dde4;
  --accent:#0d7a89; --accent-2:#a8791f; --good:#187a4f; --bad:#b8382f; --extra:#2a6fc4;
  --badge-s:55%; --badge-l:38%; --chip:#232a38;
  --display:"Zilla Slab",Georgia,serif; --body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10131a; --surface:#171b24; --surface-2:#1f2430; --ink:#e8ebf1; --muted:#8b93a3; --line:#2a3040;
    --accent:#4fd1d9; --accent-2:#d9a94a; --good:#4caf7d; --bad:#e2685f; --extra:#6aa9ff;
    --badge-s:65%; --badge-l:62%; --chip:#262d3c; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10131a; --surface:#171b24; --surface-2:#1f2430; --ink:#e8ebf1; --muted:#8b93a3; --line:#2a3040;
  --accent:#4fd1d9; --accent-2:#d9a94a; --good:#4caf7d; --bad:#e2685f; --extra:#6aa9ff;
  --badge-s:65%; --badge-l:62%; --chip:#262d3c; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.45;font-size:15px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1280px;margin:0 auto;padding:12px 16px 0;display:flex;align-items:flex-end;gap:20px;flex-wrap:wrap}
.topbar h1{font-size:1.25rem;padding-bottom:9px}
.tabs{display:flex;gap:18px}
.tabbtn{font-family:var(--mono);font-size:.8rem;background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);padding:8px 2px}
.tabbtn.active{color:var(--accent);border-bottom-color:var(--accent)}
.lock{display:flex;gap:6px;align-items:center;padding-bottom:8px}
.lock .on{color:var(--good);border-color:var(--good)}
.stamp{margin-left:auto;font-family:var(--mono);font-size:.7rem;color:var(--muted);padding-bottom:10px}

.wrap{max-width:1280px;margin:0 auto;padding-inline:16px;padding-block:18px 60px}
.notice{border:1px solid var(--line);border-left:3px solid var(--accent-2);background:var(--surface);border-radius:0 8px 8px 0;padding:10px 14px;margin-bottom:14px;font-size:.9rem}
.notice.bad{border-left-color:var(--bad)}

.builder{display:grid;grid-template-columns:230px minmax(0,1fr) 360px;gap:16px;align-items:start}
.col-h{font-family:var(--mono);font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}

/* dungeon rail */
.dlist{display:flex;flex-direction:column;gap:6px}
.dbtn{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
.dbtn .dn{font-weight:600;display:flex;justify-content:space-between;gap:8px}
.dbtn .dg{font-family:var(--mono);font-size:.72rem;color:var(--accent-2)}
.dbtn .dd{font-size:.78rem;color:var(--muted);margin-top:2px}
.dbtn.sel{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.tier{font-family:var(--mono);font-size:.64rem;color:var(--muted);margin:8px 0 2px}

/* parties */
.parties{display:flex;flex-direction:column;gap:12px;min-width:0}
.party{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;position:relative;overflow:hidden}
.party::before{content:"";position:absolute;inset:0 0 0 35%;background-size:cover;background-position:center;opacity:.34;pointer-events:none;-webkit-mask-image:linear-gradient(90deg,transparent,#000 60%);mask-image:linear-gradient(90deg,transparent,#000 60%)}
.party > *{position:relative}
.runrow{margin-top:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.runrow label{font-family:var(--mono);font-size:.68rem}
.pin{width:84px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:4px 7px;font-family:var(--mono);font-size:.82rem}
.pin.wide{width:116px}
.runbtn{background:var(--accent);color:var(--bg);border:none;border-radius:6px;padding:5px 12px;font-weight:600;font-size:.82rem}
.runbtn:disabled{opacity:.45;cursor:default}
.kin{margin-top:8px;font-size:.82rem;display:flex;gap:14px;flex-wrap:wrap}
.kin b{font-family:var(--mono);color:var(--accent-2)}
.party.active{border-color:var(--accent)}
.party-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px;cursor:pointer}
.party-h h3{font-size:1.05rem}
.party-h .pd{font-size:.86rem;color:var(--muted)}
.party-h .pact{margin-left:auto;display:flex;gap:6px}
.chipbtn{font-family:var(--mono);font-size:.68rem;background:var(--surface-2);border:1px solid var(--line);border-radius:20px;padding:3px 10px;color:var(--muted)}
.chipbtn:hover{color:var(--accent);border-color:var(--accent)}
.slots{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.slot{min-height:92px;border:1px dashed var(--line);border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:2px;background:color-mix(in srgb,var(--surface-2) 72%,transparent);min-width:0;text-align:left}
.slot.filled{border-style:solid;background:color-mix(in srgb,var(--surface) 88%,transparent)}
.slot.empty{align-items:center;justify-content:center;color:var(--muted);font-family:var(--mono);font-size:.7rem;gap:4px}
.slot.empty .own{font-family:var(--display);font-size:.95rem;font-weight:600;color:var(--ink);opacity:.7}
.slot.off{opacity:.35;border-style:dotted}
.slot .sn{font-weight:600;display:flex;align-items:center;gap:6px;min-width:0}
.slot .sn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot .sm{font-family:var(--mono);font-size:.7rem;color:var(--muted)}
.slot.filled{align-items:center;text-align:center;padding:9px 6px 7px;gap:0;border-top:3px solid hsl(var(--hue) var(--badge-s) var(--badge-l))}
.slot .sn{flex-direction:column;gap:4px;max-width:100%}
.slot .sn span{font-family:var(--display);font-size:1rem;line-height:1.1;max-width:100%}
.slot .glyph{width:38px;height:38px}
.slot .glyph img{width:31px;height:31px}
.slot .sp{font-size:.68rem;color:var(--muted);margin-top:1px}
.slot .stats{margin-top:7px;display:flex;flex-direction:column;gap:2px;align-self:stretch}
.slot .st{display:flex;justify-content:center;align-items:baseline;gap:6px}
.slot .st i{font-style:normal;font-size:.6rem;font-weight:600;letter-spacing:.06em;color:var(--muted);width:1.4em;text-align:right}
.slot .st b{font-family:var(--body);font-variant-numeric:tabular-nums lining-nums;font-weight:600;color:var(--ink);min-width:3.4em;text-align:left}
.slot .st.il b{font-size:1.08rem}
.slot .st.cp b{font-size:.9rem;font-weight:500;color:var(--accent-2)}
.slot .st.low b{color:var(--bad)}
.slot .en{font-size:.66rem;color:var(--muted);margin-top:auto;padding-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;align-self:stretch;font-variant-numeric:tabular-nums}
.slot .ebar{height:3px;background:var(--surface-2);border-radius:2px;overflow:hidden;align-self:stretch;margin-top:3px}
.slot .ebar i{display:block;height:100%;background:var(--accent)}
.slot .warn{font-size:.66rem;color:var(--bad);white-space:nowrap}
.party-f{margin-top:10px;font-size:.8rem;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
.party-f .w{color:var(--bad)}
.party-f .ok{color:var(--good)}
.addparty{border:1px dashed var(--line);background:none;border-radius:10px;padding:12px;color:var(--muted);font-family:var(--mono);font-size:.78rem}
.addparty:hover{color:var(--accent);border-color:var(--accent)}

/* roster */
.pgroup{margin-bottom:14px}
.pname{font-family:var(--display);font-weight:600;font-size:1rem;margin-bottom:6px}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.card{display:grid;grid-template-columns:36px minmax(0,1fr);gap:8px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 8px;min-width:0}
.card:hover{border-color:var(--accent)}
.card .cn{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .cs{font-family:var(--mono);font-size:.68rem;color:var(--muted);display:flex;flex-wrap:wrap;column-gap:8px}
.card .cs span{white-space:nowrap}
.card .cs b{color:var(--ink);font-weight:600}
.card .ct{font-family:var(--mono);font-size:.62rem;color:var(--accent)}
.card.used{opacity:.5}
.card.low .cs b.il{color:var(--bad)}
.glyph{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--chip);flex-shrink:0}
.glyph img{width:30px;height:30px;display:block}
.glyph.sm{width:24px;height:24px}
.glyph.sm img{width:21px;height:21px}

/* energy */
.etable-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.etable{width:100%;border-collapse:collapse;min-width:760px}
.etable th{font-family:var(--mono);font-size:.66rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);text-align:left;background:var(--surface-2);padding:8px 10px;border-bottom:1px solid var(--line)}
.etable td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.etable tr:last-child td{border-bottom:none}
.etable tr.pfirst td{border-top:2px solid var(--line)}
.ename{display:flex;align-items:center;gap:8px;font-weight:600}
.enow{font-family:var(--mono);font-size:1.05rem;font-weight:600}
.enow small{color:var(--muted);font-weight:400;font-size:.72rem}
.bar{height:5px;background:var(--surface-2);border-radius:3px;margin-top:4px;width:120px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.bar.full i{background:var(--accent-2)}
.einput{width:76px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:5px 7px;font-family:var(--mono)}
.xinput{width:78px;background:var(--surface-2);border:1px solid var(--extra);border-radius:6px;padding:5px 7px;font-family:var(--mono);color:var(--extra);font-weight:600}
.xcap{font-family:var(--mono);font-size:.72rem;color:var(--muted)}
.xs{color:var(--extra);font-weight:700;font-size:.62rem;margin-left:1px;vertical-align:super;line-height:0}
.esel{background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:5px 4px;font-family:var(--mono);font-size:.78rem}
.ebtn{background:var(--accent);color:var(--bg);border:none;border-radius:6px;padding:5px 11px;font-weight:600;font-size:.82rem}
.ebtn.ghost{background:var(--surface-2);color:var(--ink);border:1px solid var(--line);font-family:var(--mono);font-weight:400}
.eacts{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.unset{color:var(--muted);font-family:var(--mono);font-size:.8rem}
.clock{font-family:var(--mono);font-size:.82rem;color:var(--muted);margin-bottom:12px}
.clock b{color:var(--ink)}
.empty-state{border:1px dashed var(--line);border-radius:10px;padding:26px;text-align:center;color:var(--muted)}

@media (max-width:1020px){
  .builder{grid-template-columns:minmax(0,1fr)}
  .dlist{flex-direction:row;flex-wrap:wrap}
  .dbtn{width:auto;flex:1 1 150px}
  .tier{display:none}
}
@media (max-width:620px){
  .slots{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stamp{margin-left:0;width:100%}
}
</style>

<div class="topbar"><div class="topbar-in">
  <h1>Myth Party Builder</h1>
  <div class="tabs">
    <button class="tabbtn active" type="button" data-tab="builder">Builder</button>
    <button class="tabbtn" type="button" data-tab="energy">Energy</button>
  </div>
  <div class="lock"><button type="button" class="chipbtn" id="lockbtn">Unlock editing</button><span id="lockform" hidden><input class="pin wide" id="passin" type="password" autocomplete="off" placeholder="Passcode" aria-label="Group passcode"><button type="button" class="chipbtn" id="passgo">OK</button></span></div>
  <div class="stamp" id="stamp"></div>
</div></div>

<div class="wrap">
  <div id="notice" class="notice" hidden></div>

  <div id="panel-builder">
    <div class="builder">
      <div>
        <p class="col-h">Dungeon for selected party</p>
        <div class="dlist" id="dlist"></div>
      </div>
      <div class="parties" id="parties"></div>
      <div>
        <p class="col-h">Characters: click to add to the selected party</p>
        <div id="roster"><div class="empty-state">Loading the roster…</div></div>
      </div>
    </div>
  </div>

  <div id="panel-energy" hidden>
    <div class="clock" id="clock"></div>
    <p class="clock" style="margin-top:-6px">Extra (blue) energy holds up to 2,000, does not refill by itself, and can be edited by anyone. Spending uses normal energy first, then extra.</p>
    <div id="energy"><div class="empty-state">Loading the roster…</div></div>
  </div>
</div>

var CLSKEY = {Spiritmaster:"elementalist"};
var KINAH = {700:200000, 1400:300000, 2100:400000};
var HUE = {Cleric:46, Chanter:330, Templar:205, Assassin:265, Spiritmaster:150, Sorcerer:15, Gladiator:35, Ranger:95};


var XCAP = 2000, RUN = 80;
var unlocked = false;
var chars = [], energy = {}, extra = {}, parties = [{dungeon:"vakron", members:[], amount:80, runs:0, earned:0}], active = 0;
var db = null, canWrite = true, loaded = {chars:false};

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function num(n){ return (Number(n) || 0).toLocaleString("en-US"); }
function glyph(cls, small){
  var k = CLSKEY[cls] || String(cls || "").toLowerCase(), src = ART.cls[k];
  return '<span class="glyph' + (small ? " sm" : "") + '" title="' + esc(cls) + '">' + (src ? '<img alt="" src="' + src + '">' : '') + '</span>';
}
function kfmt(n){ n = Number(n) || 0; if (n >= 1e6) return (Math.round(n/1e4)/100) + "M"; if (n >= 1e3) return Math.round(n/1e3) + "k"; return String(n); }
function typing(){ var a = document.activeElement; return !!(a && a.classList && (a.classList.contains("einput") || a.classList.contains("pin") || a.classList.contains("xinput"))); }
function extraOf(n){ var x = extra[eid(n)], v = x && typeof x.value === "number" ? x.value : 0; return Math.max(0, Math.min(XCAP, Math.round(v))); }
function playerOrder(){ var o = []; chars.forEach(function(c){ if (o.indexOf(c.player) < 0) o.push(c.player); }); return o; }
function eid(n){ return String(n).replace(/[^A-Za-z0-9_-]/g, function(c){ return "~" + c.charCodeAt(0).toString(16); }); }
function byName(n){ for (var i = 0; i < chars.length; i++) if (chars[i].name === n) return chars[i]; return null; }
function dungeon(id){ for (var i = 0; i < DUNGEONS.length; i++) if (DUNGEONS[i].id === id) return DUNGEONS[i]; return DUNGEONS[0]; }
function partyOf(n){ for (var i = 0; i < parties.length; i++) if (parties[i].members.indexOf(n) >= 0) return i; return -1; }
function notice(msg, bad){ var el = $("notice"); if (!msg){ el.hidden = true; return; } el.textContent = msg; el.className = "notice" + (bad ? " bad" : ""); el.hidden = false; }

/* ---- energy clock: +15 at every hour divisible by 3 on the Amsterdam clock ---- */
var fmt = null;
try { fmt = new Intl.DateTimeFormat("en-GB", {timeZone:TZ, hour12:false, year:"numeric", month:"2-digit", day:"2-digit", hour:"2-digit", minute:"2-digit", second:"2-digit"}); } catch (e) {}
function wall(ts){
  if (!fmt) return ts - new Date(ts).getTimezoneOffset()*60000;
  var p = {}; fmt.formatToParts(new Date(ts)).forEach(function(x){ p[x.type] = x.value; });
  return Date.UTC(+p.year, +p.month - 1, +p.day, (+p.hour) % 24, +p.minute, +p.second);
}
function ticks(a, b){ return Math.max(0, Math.floor(wall(b)/PERIOD) - Math.floor(wall(a)/PERIOD)); }
function nowEnergy(name, now){
  var e = energy[eid(name)]; if (!e || typeof e.value !== "number") return null;
  var cap = e.cap || 840, v = e.value;
  if (v < cap) v = Math.min(cap, v + STEP*ticks(e.at || now, now));
  return {value:v, cap:cap, at:e.at};

  db.doc("plan/current").onSnapshot(function(s){
    var b = s.exists ? s.data() : null;
    if (b && Array.isArray(b.parties)){
      parties = b.parties.map(function(p){ return {dungeon: String(p.dungeon || "vakron"), members: Array.isArray(p.members) ? p.members.slice(0, 5).map(String) : [], amount: Number(p.amount) || 80, runs: Number(p.runs) || 0, earned: Number(p.earned) || 0}; });
    }
    if (!typing()) renderBuilder();
  });
  poll();
  setInterval(function(){ if (!document.hidden) poll(); }, 8000);
  document.addEventListener("visibilitychange", function(){ if (!document.hidden) poll(); });
  if (pass) checkPass(pass, true);
}
start();
})();
</script>
